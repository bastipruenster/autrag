<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auftragszeit-Rechner</title>
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auftragszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2f7;--card:#fff;--text:#101828;--muted:#667085;--line:#d0d5dd;--primary:#1d4ed8;--primary2:#2563eb;--green:#067647;--greenbg:#ecfdf3;--greenln:#abefc6;--warn:#b54708;--warnbg:#fffaeb;--warnln:#fedf89;--red:#b42318;--redbg:#fef3f2;--redln:#fecdca;--shadow:0 10px 26px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top left,rgba(37,99,235,.18),transparent 28rem),linear-gradient(180deg,#f8fbff 0%,var(--bg) 38%,#eef2f7 100%);color:var(--text);font-size:16px}.wrap{max-width:1120px;margin:0 auto;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:white;border-radius:24px;padding:18px;margin:4px 0 14px;box-shadow:var(--shadow)}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#dbeafe;line-height:1.4}.toolbar,.actions,.historyBtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.actions{grid-template-columns:1.25fr 1fr 1fr}.card{background:rgba(255,255,255,.96);border:1px solid rgba(208,213,221,.95);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 3px 14px rgba(16,24,40,.05)}.cardTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h2{font-size:18px;margin:0}.pill{font-size:12px;font-weight:800;color:#344054;background:#f2f4f7;border:1px solid #eaecf0;border-radius:999px;padding:5px 8px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.person{border:1px solid var(--line);border-radius:16px;padding:12px;background:linear-gradient(180deg,#fff,#fbfdff)}.personHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.personHeader h3{margin:0;font-size:17px}.number{width:30px;height:30px;border-radius:999px;background:#eff6ff;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid #bfdbfe}label{display:block;font-weight:800;margin-bottom:6px;font-size:14px}input{width:100%;min-height:50px;padding:12px;border:1px solid var(--line);border-radius:13px;font-size:18px;background:#fff;color:var(--text)}input:focus{outline:3px solid rgba(37,99,235,.18);border-color:var(--primary2)}.small{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.35}.row{margin-bottom:10px}.block{border-top:1px solid #e4e7ec;padding-top:10px;margin-top:10px}.blockTitle{font-weight:900;margin-bottom:8px;color:#344054;font-size:14px}button{width:100%;min-height:54px;border:0;border-radius:15px;background:var(--primary);color:white;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 18px rgba(29,78,216,.18)}button:active{transform:translateY(1px);filter:brightness(.96)}.btnSecondary{background:#475467;box-shadow:none}.btnSoft{background:#f2f4f7;color:#344054;border:1px solid #d0d5dd;box-shadow:none}.btnDanger{background:#b42318;box-shadow:none}.btnSave{background:#079455;box-shadow:0 8px 18px rgba(7,148,85,.18)}.status{display:none;padding:12px 14px;border-radius:15px;margin-bottom:14px;font-weight:900;line-height:1.45}.saved{background:#ecfdf3;border:1px solid #abefc6;color:#067647}.result{display:none;padding:15px;border-radius:16px;background:var(--greenbg);border:1px solid var(--greenln);color:var(--green);font-size:20px;font-weight:900;margin-bottom:14px;line-height:1.45}.result.open{background:var(--warnbg);border-color:var(--warnln);color:var(--warn)}.error{display:none;padding:12px 14px;border-radius:15px;background:var(--redbg);border:1px solid var(--redln);color:var(--red);font-weight:900;margin-bottom:14px}.note{margin-top:6px;color:var(--green);font-weight:900;min-height:18px;font-size:13px}.decimal{margin-top:10px;padding:10px;border-radius:13px;background:#f2f4f7;font-weight:800;line-height:1.5;color:#344054;font-size:14px}.calcBox,.historyBox{display:none}.step,.historyItem{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:9px;background:#fff;line-height:1.45}.step strong,.historyItem strong{display:block;color:#101828}@media(max-width:1050px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{grid-template-columns:1fr 1fr}.actions button:first-child{grid-column:1/-1}}@media(max-width:650px){.wrap{padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.hero{border-radius:20px;padding:16px}.hero h1{font-size:23px}.grid,.people,.toolbar,.actions,.historyBtns{grid-template-columns:1fr}input{font-size:20px;min-height:56px}.person{padding:13px}.stickyCalc{position:sticky;bottom:10px;z-index:20}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>Auftragszeit-Rechner</h1><p>4 Personen, Pausen, Nach-Hause-Zeit, Rest für den nächsten Tag, Verlauf und gespeicherte Eingaben.</p></section>
<div class="toolbar"><button id="saveBtn" type="button" class="btnSave">Speichern</button><button id="clearBtn" type="button" class="btnSoft">Eingaben löschen</button></div>
<div id="saveStatus" class="status saved"></div>
<section class="card"><div class="cardTitle"><h2>Auftrag</h2><span class="pill">Grunddaten</span></div><div class="grid"><div><label for="auftrag">Auftragszeit gesamt in Stunden</label><input id="auftrag" type="text" inputmode="decimal" value="3,55" placeholder="z. B. 3,55"><div class="small">Komma oder Punkt möglich. 3,55 h = 3 h 33 min.</div></div><div><label for="stueck">Stückzahl</label><input id="stueck" type="number" inputmode="numeric" min="1" value="20"><div class="small">Wird für die Zeit pro Stück angezeigt.</div></div></div></section>
<section class="card"><div class="cardTitle"><h2>Personen</h2><span class="pill">bis 4 Personen</span></div><div class="people" id="peopleBox"></div></section>
<div class="actions stickyCalc"><button id="calcBtn" type="button">Berechnen</button><button id="historyBtn" type="button" class="btnSecondary">Letzte 2 Tage</button><button id="clearHistoryBtn" type="button" class="btnDanger">Verlauf löschen</button></div>
<div id="error" class="error"></div><div id="result" class="result"></div>
<section id="calcBox" class="card calcBox"><div class="cardTitle"><h2>Rechenweg</h2><span class="pill">Details</span></div><div id="steps"></div></section>
<section id="historyBox" class="card historyBox"><div class="cardTitle"><h2>Letzte 2 Tage</h2><span class="pill">Verlauf</span></div><div id="historyList"></div></section>
</main>
<script>
function buildPeople(){var box=document.getElementById("peopleBox");box.innerHTML="";for(var i=1;i<=4;i++){var div=document.createElement("div");div.className="person";div.innerHTML="<div class='personHeader'><h3>Person "+i+"</h3><div class='number'>"+i+"</div></div>"+"<div class='row'><label for='p"+i+"start'>Startzeit</label><input id='p"+i+"start' type='time' value=''></div>"+"<div class='row'><label for='p"+i+"end'>Endzeit</label><input id='p"+i+"end' type='time' value=''><div class='small'>Leer lassen = arbeitet bis Fertigzeit oder bis Nach-Hause-Zeit.</div><div id='p"+i+"note' class='note'></div></div>"+"<div class='block'><div class='blockTitle'>Feierabend</div><div class='row'><label for='p"+i+"home'>Nach Hause um</label><input id='p"+i+"home' type='time' value=''><div class='small'>Wenn eingetragen, zählt diese Person nur bis zu dieser Uhrzeit.</div></div></div>"+"<div class='block'><div class='blockTitle'>Pause</div><div class='row'><label for='p"+i+"pauseStart'>Anfang Pause</label><input id='p"+i+"pauseStart' type='time' value=''></div><div class='row'><label for='p"+i+"pauseDur'>Pausendauer in Minuten</label><input id='p"+i+"pauseDur' type='number' inputmode='numeric' min='0' value='' placeholder='z. B. 30'><div class='small'>Leer lassen = keine Pause.</div></div></div>"+"<div id='p"+i+"dec' class='decimal'>Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -<br>Rest bis Nach Hause: -</div>";box.appendChild(div)}}
function num(v){return Number(String(v||"").replace(",","."))}function timeToMin(v){if(!v)return null;var p=v.split(":");return Number(p[0])*60+Number(p[1])}function minToTime(m){m=Math.round(m);var d=1440;m=((m%d)+d)%d;var h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0")}function hoursText(h){return h.toFixed(2).replace(".",",")+" h"}function durationText(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),mm=m%60;if(h===0)return mm+" Min";if(mm===0)return h+" Std";return h+" Std "+mm+" Min"}function minText(m){return Math.round(m)+" min"}
function showSavedStatus(t){var s=document.getElementById("saveStatus");s.textContent=t;s.style.display="block";setTimeout(function(){s.style.display="none"},2500)}function saveInputs(show){var data={};document.querySelectorAll("input").forEach(function(input){if(!input.id)return;data[input.id]=input.type==="checkbox"?input.checked:input.value});localStorage.setItem("auftragszeit_rechner_eingaben_v4",JSON.stringify(data));if(show)showSavedStatus("Gespeichert")}function loadInputs(){try{var raw=localStorage.getItem("auftragszeit_rechner_eingaben_v4")||localStorage.getItem("auftragszeit_rechner_eingaben_v3")||localStorage.getItem("auftragszeit_rechner_eingaben_v2")||localStorage.getItem("auftragszeit_rechner_eingaben_v1");if(!raw)return;var data=JSON.parse(raw);Object.keys(data).forEach(function(id){var input=document.getElementById(id);if(!input)return;if(input.type==="checkbox")input.checked=!!data[id];else input.value=data[id]})}catch(e){}}function clearSavedInputs(){localStorage.removeItem("auftragszeit_rechner_eingaben_v4");localStorage.removeItem("auftragszeit_rechner_eingaben_v3");localStorage.removeItem("auftragszeit_rechner_eingaben_v2");localStorage.removeItem("auftragszeit_rechner_eingaben_v1");document.querySelectorAll("input").forEach(function(input){if(input.id==="auftrag")input.value="3,55";else if(input.id==="stueck")input.value="20";else input.value=""});reset();showSavedStatus("Eingaben gelöscht")}function setupAutoSave(){loadInputs();document.querySelectorAll("input").forEach(function(input){input.addEventListener("input",function(){saveInputs(false)});input.addEventListener("change",function(){saveInputs(false)})})}
function getHistory(){try{return JSON.parse(localStorage.getItem("auftragszeit_rechner_verlauf_v1")||"[]")}catch(e){return[]}}function saveHistoryEntry(entry){var history=getHistory(),now=Date.now(),twoDays=172800000;history=history.filter(function(item){return item.timestamp&&(now-item.timestamp)<=twoDays});history.unshift(entry);history=history.slice(0,30);localStorage.setItem("auftragszeit_rechner_verlauf_v1",JSON.stringify(history))}function collectInputSnapshot(){var s={};document.querySelectorAll("input").forEach(function(input){if(input.id)s[input.id]=input.value});return s}function addCurrentCalculationToHistory(status,details){saveHistoryEntry({timestamp:Date.now(),status:status,details:details,inputs:collectInputSnapshot()})}function renderHistory(){var box=document.getElementById("historyBox"),list=document.getElementById("historyList"),now=Date.now(),twoDays=172800000,history=getHistory().filter(function(item){return item.timestamp&&(now-item.timestamp)<=twoDays});localStorage.setItem("auftragszeit_rechner_verlauf_v1",JSON.stringify(history));list.innerHTML="";if(history.length===0){list.innerHTML="<div class='historyItem'>Noch keine gespeicherten Berechnungen in den letzten 2 Tagen.</div>"}else{history.forEach(function(item){var d=new Date(item.timestamp),div=document.createElement("div");div.className="historyItem";div.innerHTML="<strong>"+d.toLocaleDateString("de-DE")+" "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+"</strong>"+(item.status||"")+"<br>"+(item.details||"");list.appendChild(div)})}box.style.display="block";box.scrollIntoView({behavior:"smooth",block:"start"})}function clearHistory(){localStorage.removeItem("auftragszeit_rechner_verlauf_v1");renderHistory();showSavedStatus("Verlauf gelöscht")}
function reset(){document.getElementById("error").style.display="none";var r=document.getElementById("result");r.style.display="none";r.className="result";document.getElementById("calcBox").style.display="none";document.getElementById("steps").innerHTML="";for(var i=1;i<=4;i++){document.getElementById("p"+i+"note").textContent="";document.getElementById("p"+i+"dec").innerHTML="Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -<br>Rest bis Nach Hause: -"}}function showError(t){var e=document.getElementById("error");e.textContent=t;e.style.display="block"}function active(p,t){var end=p.limitEnd===null?Infinity:p.limitEnd;if(!(p.start<=t&&t<end))return false;if(p.pauseStart!==null&&p.pauseEnd!==null&&p.pauseStart<=t&&t<p.pauseEnd)return false;return true}function nextChange(people,current){var times=[];people.forEach(function(p){if(p.start>current)times.push(p.start);if(p.limitEnd!==null&&p.limitEnd>current)times.push(p.limitEnd);if(p.pauseStart!==null&&p.pauseStart>current)times.push(p.pauseStart);if(p.pauseEnd!==null&&p.pauseEnd>current)times.push(p.pauseEnd)});return times.length?Math.min.apply(null,times):Infinity}
function calculate(){reset();saveInputs(false);var auftragHours=num(document.getElementById("auftrag").value),stueck=Number(document.getElementById("stueck").value||0);if(!auftragHours||auftragHours<=0){showError("Bitte eine gültige Auftragszeit eingeben, z. B. 3,55.");return}var required=auftragHours*60,people=[],personWork={1:0,2:0,3:0,4:0},personPause={1:0,2:0,3:0,4:0};for(var i=1;i<=4;i++){var startVal=document.getElementById("p"+i+"start").value,endVal=document.getElementById("p"+i+"end").value,homeVal=document.getElementById("p"+i+"home").value,psVal=document.getElementById("p"+i+"pauseStart").value,pdVal=document.getElementById("p"+i+"pauseDur").value,pd=pdVal===""?0:Number(pdVal);if(!startVal&&(endVal||homeVal||psVal||pd>0)){showError("Bei Person "+i+" ist etwas eingetragen, aber keine Startzeit.");return}if(pd<0){showError("Die Pausendauer bei Person "+i+" darf nicht negativ sein.");return}if(pd>0&&!psVal){showError("Bitte bei Person "+i+" auch den Anfang der Pause eintragen.");return}if(psVal&&pd<=0){showError("Bitte bei Person "+i+" auch die Pausendauer eintragen.");return}if(startVal){var start=timeToMin(startVal),end=timeToMin(endVal),home=timeToMin(homeVal),ps=timeToMin(psVal),pe=null;if(end!==null&&end<=start)end+=1440;if(home!==null&&home<=start)home+=1440;var limit=null;if(end!==null&&home!==null)limit=Math.min(end,home);else if(end!==null)limit=end;else if(home!==null)limit=home;if(limit!==null&&limit<=start){showError("Bei Person "+i+" liegt die End-/Nach-Hause-Zeit vor der Startzeit.");return}if(ps!==null){if(ps<start)ps+=1440;pe=ps+pd;if(limit!==null&&ps>=limit){showError("Die Pause bei Person "+i+" beginnt nach der End-/Nach-Hause-Zeit.");return}}people.push({index:i,start:start,limitEnd:limit,openEnd:endVal===""&&homeVal==="",home:home,pauseStart:ps,pauseEnd:pe})}}if(people.length===0){showError("Bitte mindestens eine Startzeit eintragen.");return}people.sort(function(a,b){return a.start-b.start});var firstStart=Math.min.apply(null,people.map(function(p){return p.start})),current=firstStart,done=0,steps=[];for(var guard=0;guard<20000;guard++){var act=people.filter(function(p){return active(p,current)});if(act.length===0){var nc=nextChange(people,current);if(nc===Infinity){showResult(false,current,required-done);return}current=nc;continue}var next=nextChange(people,current),rate=act.length,remaining=required-done,needed=remaining/rate;if(current+needed<=next){var finish=current+needed,seg=finish-current;act.forEach(function(p){personWork[p.index]+=seg});steps.push({from:current,to:finish,active:act.map(function(p){return p.index}).join(", "),real:seg,work:seg*rate});done=required;showResult(true,finish,0);return}var fixed=next-current;act.forEach(function(p){personWork[p.index]+=fixed});done+=fixed*rate;steps.push({from:current,to:next,active:act.map(function(p){return p.index}).join(", "),real:fixed,work:fixed*rate});current=next}showError("Berechnung abgebrochen. Bitte Eingaben prüfen.");
function calcPauses(until){people.forEach(function(p){if(p.pauseStart!==null&&p.pauseEnd!==null){var a=Math.max(p.pauseStart,p.start),b=Math.min(p.pauseEnd,until);if(p.limitEnd!==null)b=Math.min(b,p.limitEnd);if(b>a)personPause[p.index]=b-a}})}function fillPersonOutputs(until){calcPauses(until);for(var j=1;j<=4;j++){var homeRestText="-",pp=people.find(function(x){return x.index===j});if(pp&&pp.home!==null&&until<pp.home){var restHome=pp.home-until;homeRestText=hoursText(restHome/60)+" = "+durationText(restHome)}else if(pp&&pp.home!==null){homeRestText="0 Min"}document.getElementById("p"+j+"dec").innerHTML="Arbeitszeit: "+hoursText(personWork[j]/60)+" = "+durationText(personWork[j])+"<br>Pause: "+minText(personPause[j])+" = "+durationText(personPause[j])+"<br>Anwesenheit inkl. Pause: "+hoursText((personWork[j]+personPause[j])/60)+" = "+durationText(personWork[j]+personPause[j])+"<br>Rest bis Nach Hause: "+homeRestText}}function showResult(finished,time,rest){rest=Math.max(0,rest);fillPersonOutputs(time);var total=time-firstStart,r=document.getElementById("result");if(finished){r.className="result";var homeLines=[];people.forEach(function(p){if(p.home!==null&&time<p.home){var restHome=p.home-time;homeLines.push("Person "+p.index+": "+durationText(restHome)+" ("+hoursText(restHome/60)+")")}});var homeSummary=homeLines.length?"<br><span style='font-size:16px;'>Zeit bis Nach Hause: "+homeLines.join(" | ")+"</span>":"";r.innerHTML="Fertig um "+minToTime(time)+" Uhr<br><span style='font-size:16px;'>Gesamtdauer: "+durationText(total)+" ("+hoursText(total/60)+")</span><br><span style='font-size:16px;'>Rest für nächsten Tag: 0 Min</span>"+homeSummary}else{r.className="result open";r.innerHTML="Heute nicht fertig<br><span style='font-size:16px;'>Berechnet bis: "+minToTime(time)+" Uhr</span><br><span style='font-size:16px;'>Erledigt: "+hoursText(done/60)+" = "+durationText(done)+"</span><br><span style='font-size:16px;'>Rest für nächsten Tag: "+hoursText(rest/60)+" = "+durationText(rest)+"</span>"}r.style.display="block";var historyStatus=finished?("Fertig um "+minToTime(time)+" Uhr"):"Heute nicht fertig",historyDetail=finished?("Gesamtdauer: "+durationText(total)+" ("+hoursText(total/60)+"), Rest nächster Tag: 0 Min"):("Berechnet bis: "+minToTime(time)+", Erledigt: "+hoursText(done/60)+" = "+durationText(done)+", Rest nächster Tag: "+hoursText(rest/60)+" = "+durationText(rest));addCurrentCalculationToHistory(historyStatus,historyDetail);people.forEach(function(p){if(finished&&p.openEnd)document.getElementById("p"+p.index+"note").textContent="Berechnetes Ende: "+minToTime(time)+" Uhr";else if(p.home!==null)document.getElementById("p"+p.index+"note").textContent="Berechnet bis Nach Hause: "+minToTime(p.home)+" Uhr";else if(p.limitEnd!==null)document.getElementById("p"+p.index+"note").textContent="Berechnet bis Ende: "+minToTime(p.limitEnd)+" Uhr"});buildSteps(total,rest)}function buildSteps(total,rest){var box=document.getElementById("steps"),head=document.createElement("div");head.className="step";var perPiece=stueck>0?"<br>Zeit pro Stück: <strong>"+hoursText(auftragHours/stueck)+" = "+durationText(required/stueck)+"</strong>":"";head.innerHTML="Auftragszeit gesamt: <strong>"+hoursText(auftragHours)+" = "+durationText(required)+"</strong>"+perPiece+"<br>Bereits erledigt: <strong>"+hoursText(done/60)+" = "+durationText(done)+"</strong><br>Rest für nächsten Tag: <strong>"+hoursText(rest/60)+" = "+durationText(rest)+"</strong><br>Berechnete Dauer: <strong>"+durationText(total)+" = "+hoursText(total/60)+"</strong>";box.appendChild(head);steps.forEach(function(s){var div=document.createElement("div");div.className="step";div.innerHTML="<strong>"+minToTime(s.from)+" bis "+minToTime(s.to)+"</strong>Person(en) aktiv: "+s.active+"<br>Echte Zeit: "+durationText(s.real)+" ("+minText(s.real)+")<br>Arbeitsleistung: "+durationText(s.work)+" = "+hoursText(s.work/60);box.appendChild(div)});document.getElementById("calcBox").style.display="block"}}
document.addEventListener("DOMContentLoaded",function(){buildPeople();setupAutoSave();var calcBtn=document.getElementById("calcBtn");calcBtn.addEventListener("click",calculate);calcBtn.addEventListener("touchend",function(e){e.preventDefault();calculate()},{passive:false});var saveBtn=document.getElementById("saveBtn");saveBtn.addEventListener("click",function(){saveInputs(true)});saveBtn.addEventListener("touchend",function(e){e.preventDefault();saveInputs(true)},{passive:false});var clearBtn=document.getElementById("clearBtn");clearBtn.addEventListener("click",clearSavedInputs);clearBtn.addEventListener("touchend",function(e){e.preventDefault();clearSavedInputs()},{passive:false});var historyBtn=document.getElementById("historyBtn");historyBtn.addEventListener("click",renderHistory);historyBtn.addEventListener("touchend",function(e){e.preventDefault();renderHistory()},{passive:false});var clearHistoryBtn=document.getElementById("clearHistoryBtn");clearHistoryBtn.addEventListener("click",clearHistory);clearHistoryBtn.addEventListener("touchend",function(e){e.preventDefault();clearHistory()},{passive:false});if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}});
</script>
</body>
</html>
