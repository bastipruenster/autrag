<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auftragszeit-Rechner</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auftragszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#101828;font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:24px;margin:10px 0 4px} h2{font-size:18px;margin:0 0 12px}
p{color:#667085;margin-top:0}
.card{background:#fff;border:1px solid #d0d5dd;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(16,24,40,.06)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.person{border:1px solid #d0d5dd;border-radius:14px;padding:12px;background:#fcfcfd}
label{display:block;font-weight:700;margin-bottom:6px}
input{width:100%;min-height:52px;padding:12px;border:1px solid #d0d5dd;border-radius:12px;font-size:18px;background:#fff}
input:focus{outline:3px solid rgba(37,99,235,.22);border-color:#2563eb}
.small{font-size:13px;color:#667085;margin-top:5px}.row{margin-bottom:10px}
.block{border-top:1px solid #d0d5dd;padding-top:10px;margin-top:10px}
.blockTitle{font-weight:700;margin-bottom:8px;color:#344054}
button{width:100%;min-height:58px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:20px;font-weight:700;cursor:pointer;touch-action:manipulation;margin-bottom:12px}
button:active{background:#1d4ed8;transform:translateY(1px)}
.result{display:none;padding:14px;border-radius:14px;background:#ecfdf3;border:1px solid #abefc6;color:#067647;font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.45}
.result.open{background:#fffaeb;border-color:#fedf89;color:#b54708}
.error{display:none;padding:12px;border-radius:12px;background:#fef3f2;border:1px solid #fecdca;color:#b42318;font-weight:700;margin-bottom:12px}
.note{margin-top:6px;color:#067647;font-weight:700;min-height:18px}
.decimal{margin-top:8px;padding:8px;border-radius:10px;background:#f2f4f7;font-weight:700;line-height:1.45}
.calcBox{display:none}.step{border:1px solid #d0d5dd;border-radius:12px;padding:10px;margin-bottom:8px;background:#fff;line-height:1.45}.step strong{display:block}
@media(max-width:1050px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.wrap{padding:10px}h1{font-size:22px}.grid,.people{grid-template-columns:1fr}input{font-size:20px;min-height:56px}button{position:sticky;bottom:10px;z-index:10;box-shadow:0 8px 18px rgba(37,99,235,.28)}}

.historyBox{display:none}
.historyItem{border:1px solid #d0d5dd;border-radius:12px;padding:10px;margin-bottom:8px;background:#fff;line-height:1.45}
.historyItem strong{display:block}
.secondaryBtn{background:#667085!important}
.dangerBtn{background:#b42318!important}
.navBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:650px){.navBtns{grid-template-columns:1fr}}

</style>
</head>
<body>
<main class="wrap">
<h1>Auftragszeit-Rechner</h1>
<p>Mit 4 Personen, Pausen, Nach-Hause-Zeit, Restzeit, automatischem Speichern und Verlauf der letzten 2 Tage.</p>

<section class="card">
  <div class="grid">
    <div>
      <label for="auftrag">Auftragszeit gesamt in Stunden</label>
      <input id="auftrag" type="text" inputmode="decimal" value="3,55" placeholder="z. B. 3,55">
      <div class="small">Komma oder Punkt möglich. 3,55 h = 3 h 33 min.</div>
    </div>
    <div>
      <label for="stueck">Stückzahl</label>
      <input id="stueck" type="number" inputmode="numeric" min="1" value="20">
      <div class="small">Wird für die Zeit pro Stück angezeigt.</div>
    </div>
  </div>
</section>

<section class="card"><div class="people" id="peopleBox"></div></section>
<button id="calcBtn" type="button">Berechnen</button>
<div class="navBtns"><button id="historyBtn" type="button" class="secondaryBtn">Letzte 2 Tage anzeigen</button><button id="clearHistoryBtn" type="button" class="dangerBtn">Verlauf löschen</button></div>
<button id="clearBtn" type="button" style="background:#667085;">Eingaben löschen</button>
<div id="error" class="error"></div>
<div id="result" class="result"></div>
<section id="calcBox" class="card calcBox"><h2>Rechenweg</h2><div id="steps"></div></section>
<section id="historyBox" class="card historyBox"><h2>Letzte 2 Tage</h2><div id="historyList"></div></section>
</main>

<script>
function buildPeople(){
  var box=document.getElementById("peopleBox");
  for(var i=1;i<=4;i++){
    var div=document.createElement("div");
    div.className="person";
    div.innerHTML=
      "<h2>Person "+i+"</h2>"+
      "<div class='row'><label for='p"+i+"start'>Startzeit</label><input id='p"+i+"start' type='time' value=''></div>"+
      "<div class='row'><label for='p"+i+"end'>Endzeit</label><input id='p"+i+"end' type='time' value=''><div class='small'>Leer lassen = arbeitet bis Fertigzeit oder bis Nach-Hause-Zeit.</div><div id='p"+i+"note' class='note'></div></div>"+
      "<div class='block'><div class='blockTitle'>Feierabend</div><div class='row'><label for='p"+i+"home'>Nach Hause um</label><input id='p"+i+"home' type='time' value=''><div class='small'>Wenn eingetragen, wird diese Person nur bis zu dieser Uhrzeit berechnet.</div></div></div>"+
      "<div class='block'><div class='blockTitle'>Pause Person "+i+"</div><div class='row'><label for='p"+i+"pauseStart'>Anfang Pause</label><input id='p"+i+"pauseStart' type='time' value=''></div><div class='row'><label for='p"+i+"pauseDur'>Pausendauer in Minuten</label><input id='p"+i+"pauseDur' type='number' inputmode='numeric' min='0' value='' placeholder='z. B. 30'><div class='small'>Leer lassen = keine Pause.</div></div></div>"+
      "<div id='p"+i+"dec' class='decimal'>Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -<br>Rest bis Nach Hause: -</div>";
    box.appendChild(div);
  }
}
function num(v){return Number(String(v||"").replace(",","."))}
function timeToMin(v){if(!v)return null;var p=v.split(":");return Number(p[0])*60+Number(p[1])}
function minToTime(m){m=Math.round(m);var d=1440;m=((m%d)+d)%d;var h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0")}
function hoursText(h){return h.toFixed(2).replace(".",",")+" h"}
function durationText(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),mm=m%60;if(h===0)return mm+" Min";if(mm===0)return h+" Std";return h+" Std "+mm+" Min"}
function minText(m){return Math.round(m)+" min"}
function reset(){
  document.getElementById("error").style.display="none";
  var r=document.getElementById("result");r.style.display="none";r.className="result";
  document.getElementById("calcBox").style.display="none";document.getElementById("steps").innerHTML="";
  for(var i=1;i<=4;i++){document.getElementById("p"+i+"note").textContent="";document.getElementById("p"+i+"dec").innerHTML="Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -<br>Rest bis Nach Hause: -"}
}
function showError(t){var e=document.getElementById("error");e.textContent=t;e.style.display="block"}
function active(p,t){
  var end=p.limitEnd===null?Infinity:p.limitEnd;
  if(!(p.start<=t&&t<end))return false;
  if(p.pauseStart!==null&&p.pauseEnd!==null&&p.pauseStart<=t&&t<p.pauseEnd)return false;
  return true;
}
function nextChange(people,current){
  var times=[];
  people.forEach(function(p){
    if(p.start>current)times.push(p.start);
    if(p.limitEnd!==null&&p.limitEnd>current)times.push(p.limitEnd);
    if(p.pauseStart!==null&&p.pauseStart>current)times.push(p.pauseStart);
    if(p.pauseEnd!==null&&p.pauseEnd>current)times.push(p.pauseEnd);
  });
  return times.length?Math.min.apply(null,times):Infinity;
}
function calculate(){
  reset();
  var auftragHours=num(document.getElementById("auftrag").value);
  var stueck=Number(document.getElementById("stueck").value||0);
  if(!auftragHours||auftragHours<=0){showError("Bitte eine gültige Auftragszeit eingeben, z. B. 3,55.");return}
  var required=auftragHours*60, people=[], personWork={1:0,2:0,3:0,4:0}, personPause={1:0,2:0,3:0,4:0};
  for(var i=1;i<=4;i++){
    var startVal=document.getElementById("p"+i+"start").value;
    var endVal=document.getElementById("p"+i+"end").value;
    var homeVal=document.getElementById("p"+i+"home").value;
    var psVal=document.getElementById("p"+i+"pauseStart").value;
    var pdVal=document.getElementById("p"+i+"pauseDur").value;
    var pd=pdVal===""?0:Number(pdVal);
    if(!startVal&&(endVal||homeVal||psVal||pd>0)){showError("Bei Person "+i+" ist etwas eingetragen, aber keine Startzeit.");return}
    if(pd<0){showError("Die Pausendauer bei Person "+i+" darf nicht negativ sein.");return}
    if(pd>0&&!psVal){showError("Bitte bei Person "+i+" auch den Anfang der Pause eintragen.");return}
    if(psVal&&pd<=0){showError("Bitte bei Person "+i+" auch die Pausendauer eintragen.");return}
    if(startVal){
      var start=timeToMin(startVal), end=timeToMin(endVal), home=timeToMin(homeVal), ps=timeToMin(psVal), pe=null;
      if(end!==null&&end<=start)end+=1440;
      if(home!==null&&home<=start)home+=1440;
      var limit=null;
      if(end!==null&&home!==null)limit=Math.min(end,home); else if(end!==null)limit=end; else if(home!==null)limit=home;
      if(limit!==null&&limit<=start){showError("Bei Person "+i+" liegt die End-/Nach-Hause-Zeit vor der Startzeit.");return}
      if(ps!==null){if(ps<start)ps+=1440;pe=ps+pd;if(limit!==null&&ps>=limit){showError("Die Pause bei Person "+i+" beginnt nach der End-/Nach-Hause-Zeit.");return}}
      people.push({index:i,start:start,limitEnd:limit,openEnd:endVal===""&&homeVal==="",home:home,pauseStart:ps,pauseEnd:pe});
    }
  }
  if(people.length===0){showError("Bitte mindestens eine Startzeit eintragen.");return}
  people.sort(function(a,b){return a.start-b.start});
  var firstStart=Math.min.apply(null,people.map(function(p){return p.start}));
  var current=firstStart, done=0, steps=[];
  for(var guard=0;guard<20000;guard++){
    var act=people.filter(function(p){return active(p,current)});
    if(act.length===0){
      var nc=nextChange(people,current);
      if(nc===Infinity){showResult(false,current,required-done);return}
      current=nc;continue;
    }
    var next=nextChange(people,current), rate=act.length, remaining=required-done, needed=remaining/rate;
    if(current+needed<=next){
      var finish=current+needed, seg=finish-current;
      act.forEach(function(p){personWork[p.index]+=seg});
      steps.push({from:current,to:finish,active:act.map(function(p){return p.index}).join(", "),real:seg,work:seg*rate});
      done=required;
      showResult(true,finish,0);
      return;
    }
    var fixed=next-current;
    act.forEach(function(p){personWork[p.index]+=fixed});
    done+=fixed*rate;
    steps.push({from:current,to:next,active:act.map(function(p){return p.index}).join(", "),real:fixed,work:fixed*rate});
    current=next;
  }
  showError("Berechnung abgebrochen. Bitte Eingaben prüfen.");
  function calcPauses(until){
    people.forEach(function(p){
      if(p.pauseStart!==null&&p.pauseEnd!==null){
        var a=Math.max(p.pauseStart,p.start), b=Math.min(p.pauseEnd,until);
        if(p.limitEnd!==null)b=Math.min(b,p.limitEnd);
        if(b>a)personPause[p.index]=b-a;
      }
    });
  }
  function fillPersonOutputs(until){
    calcPauses(until);
    for(var j=1;j<=4;j++){
      var homeRestText = "-";
      var pp = people.find(function(x){return x.index===j});
      if(pp && pp.home!==null && until < pp.home){
        var restHome = pp.home - until;
        homeRestText = hoursText(restHome/60)+" = "+durationText(restHome);
      } else if(pp && pp.home!==null) {
        homeRestText = "0 Min";
      }
      document.getElementById("p"+j+"dec").innerHTML=
        "Arbeitszeit: "+hoursText(personWork[j]/60)+" = "+durationText(personWork[j])+
        "<br>Pause: "+minText(personPause[j])+" = "+durationText(personPause[j])+
        "<br>Anwesenheit inkl. Pause: "+hoursText((personWork[j]+personPause[j])/60)+" = "+durationText(personWork[j]+personPause[j])+
        "<br>Rest bis Nach Hause: "+homeRestText;
    }
  }
  function showResult(finished,time,rest){
    rest=Math.max(0,rest);
    fillPersonOutputs(time);
    var total=time-firstStart, r=document.getElementById("result");
    if(finished){
      r.className="result";
      var homeSummary = "";
      var homeLines = [];
      people.forEach(function(p){
        if(p.home!==null && time < p.home){
          var restHome = p.home - time;
          homeLines.push("Person "+p.index+": "+durationText(restHome)+" ("+hoursText(restHome/60)+")");
        }
      });
      if(homeLines.length){
        homeSummary = "<br><span style='font-size:16px;'>Zeit bis Nach Hause: "+homeLines.join(" | ")+"</span>";
      }
      r.innerHTML="Fertig um "+minToTime(time)+" Uhr<br><span style='font-size:16px;'>Gesamtdauer: "+durationText(total)+" ("+hoursText(total/60)+")</span><br><span style='font-size:16px;'>Rest für nächsten Tag: 0 Min</span>"+homeSummary;
    }else{
      r.className="result open";
      r.innerHTML="Heute nicht fertig<br><span style='font-size:16px;'>Berechnet bis: "+minToTime(time)+" Uhr</span><br><span style='font-size:16px;'>Erledigt: "+hoursText(done/60)+" = "+durationText(done)+"</span><br><span style='font-size:16px;'>Rest für nächsten Tag: "+hoursText(rest/60)+" = "+durationText(rest)+"</span>";
    }
    r.style.display="block";
    people.forEach(function(p){
      if(finished&&p.openEnd)document.getElementById("p"+p.index+"note").textContent="Berechnetes Ende: "+minToTime(time)+" Uhr";
      else if(p.home!==null)document.getElementById("p"+p.index+"note").textContent="Berechnet bis Nach Hause: "+minToTime(p.home)+" Uhr";
      else if(p.limitEnd!==null)document.getElementById("p"+p.index+"note").textContent="Berechnet bis Ende: "+minToTime(p.limitEnd)+" Uhr";
    });
    buildSteps(total,rest);
  }
  function buildSteps(total,rest){
    var box=document.getElementById("steps");
    var head=document.createElement("div");head.className="step";
    var perPiece=stueck>0?"<br>Zeit pro Stück: <strong>"+hoursText(auftragHours/stueck)+" = "+durationText(required/stueck)+"</strong>":"";
    head.innerHTML="Auftragszeit gesamt: <strong>"+hoursText(auftragHours)+" = "+durationText(required)+"</strong>"+
      perPiece+
      "<br>Bereits erledigt: <strong>"+hoursText(done/60)+" = "+durationText(done)+"</strong>"+
      "<br>Rest für nächsten Tag: <strong>"+hoursText(rest/60)+" = "+durationText(rest)+"</strong>"+
      "<br>Berechnete Dauer: <strong>"+durationText(total)+" = "+hoursText(total/60)+"</strong>";
    box.appendChild(head);
    steps.forEach(function(s){
      var div=document.createElement("div");div.className="step";
      div.innerHTML="<strong>"+minToTime(s.from)+" bis "+minToTime(s.to)+"</strong>Person(en) aktiv: "+s.active+"<br>Echte Zeit: "+durationText(s.real)+" ("+minText(s.real)+")<br>Arbeitsleistung: "+durationText(s.work)+" = "+hoursText(s.work/60);
      box.appendChild(div);
    });
    document.getElementById("calcBox").style.display="block";
  }
}

function saveInputs(){
  var data = {};
  document.querySelectorAll("input").forEach(function(input){
    if(!input.id) return;
    if(input.type === "checkbox"){
      data[input.id] = input.checked;
    } else {
      data[input.id] = input.value;
    }
  });
  localStorage.setItem("auftragszeit_rechner_eingaben_v1", JSON.stringify(data));
}

function loadInputs(){
  try {
    var raw = localStorage.getItem("auftragszeit_rechner_eingaben_v1");
    if(!raw) return;
    var data = JSON.parse(raw);
    Object.keys(data).forEach(function(id){
      var input = document.getElementById(id);
      if(!input) return;
      if(input.type === "checkbox"){
        input.checked = !!data[id];
      } else {
        input.value = data[id];
      }
    });
  } catch(e) {}
}

function clearSavedInputs(){
  localStorage.removeItem("auftragszeit_rechner_eingaben_v1");
  document.querySelectorAll("input").forEach(function(input){
    if(input.id === "auftrag") input.value = "3,55";
    else if(input.id === "stueck") input.value = "20";
    else if(input.type === "checkbox") input.checked = false;
    else input.value = "";
  });
  reset();
}

function setupAutoSave(){
  loadInputs();
  document.querySelectorAll("input").forEach(function(input){
    input.addEventListener("input", saveInputs);
    input.addEventListener("change", saveInputs);
  });
}


function saveInputs(){
  var data = {};
  document.querySelectorAll("input").forEach(function(input){
    if(!input.id) return;
    if(input.type === "checkbox"){
      data[input.id] = input.checked;
    } else {
      data[input.id] = input.value;
    }
  });
  localStorage.setItem("auftragszeit_rechner_eingaben_v2", JSON.stringify(data));
}

function loadInputs(){
  try {
    var raw = localStorage.getItem("auftragszeit_rechner_eingaben_v2") || localStorage.getItem("auftragszeit_rechner_eingaben_v1");
    if(!raw) return;
    var data = JSON.parse(raw);
    Object.keys(data).forEach(function(id){
      var input = document.getElementById(id);
      if(!input) return;
      if(input.type === "checkbox"){
        input.checked = !!data[id];
      } else {
        input.value = data[id];
      }
    });
  } catch(e) {}
}

function clearSavedInputs(){
  localStorage.removeItem("auftragszeit_rechner_eingaben_v2");
  localStorage.removeItem("auftragszeit_rechner_eingaben_v1");
  document.querySelectorAll("input").forEach(function(input){
    if(input.id === "auftrag") input.value = "3,55";
    else if(input.id === "stueck") input.value = "20";
    else if(input.type === "checkbox") input.checked = false;
    else input.value = "";
  });
  reset();
}

function setupAutoSave(){
  loadInputs();
  document.querySelectorAll("input").forEach(function(input){
    input.addEventListener("input", saveInputs);
    input.addEventListener("change", saveInputs);
  });
}

function getHistory(){
  try {
    return JSON.parse(localStorage.getItem("auftragszeit_rechner_verlauf_v1") || "[]");
  } catch(e) {
    return [];
  }
}

function saveHistoryEntry(entry){
  var history = getHistory();
  var now = Date.now();
  var twoDays = 2 * 24 * 60 * 60 * 1000;
  history = history.filter(function(item){ return item.timestamp && (now - item.timestamp) <= twoDays; });
  history.unshift(entry);
  history = history.slice(0, 30);
  localStorage.setItem("auftragszeit_rechner_verlauf_v1", JSON.stringify(history));
}

function collectInputSnapshot(){
  var snapshot = {};
  document.querySelectorAll("input").forEach(function(input){
    if(!input.id) return;
    snapshot[input.id] = input.type === "checkbox" ? input.checked : input.value;
  });
  return snapshot;
}

function addCurrentCalculationToHistory(statusText, detailText){
  saveHistoryEntry({
    timestamp: Date.now(),
    status: statusText,
    details: detailText,
    inputs: collectInputSnapshot()
  });
}

function renderHistory(){
  var box = document.getElementById("historyBox");
  var list = document.getElementById("historyList");
  if(!box || !list) return;

  var now = Date.now();
  var twoDays = 2 * 24 * 60 * 60 * 1000;
  var history = getHistory().filter(function(item){ return item.timestamp && (now - item.timestamp) <= twoDays; });
  localStorage.setItem("auftragszeit_rechner_verlauf_v1", JSON.stringify(history));

  list.innerHTML = "";
  if(history.length === 0){
    list.innerHTML = "<div class='historyItem'>Noch keine gespeicherten Berechnungen in den letzten 2 Tagen.</div>";
  } else {
    history.forEach(function(item, idx){
      var d = new Date(item.timestamp);
      var div = document.createElement("div");
      div.className = "historyItem";
      div.innerHTML =
        "<strong>" + d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) + "</strong>" +
        (item.status || "") +
        "<br>" + (item.details || "");
      list.appendChild(div);
    });
  }
  box.style.display = "block";
  box.scrollIntoView({behavior:"smooth", block:"start"});
}

function clearHistory(){
  localStorage.removeItem("auftragszeit_rechner_verlauf_v1");
  renderHistory();
}

document.addEventListener("DOMContentLoaded",function(){
  buildPeople();
  setupAutoSave();

  var btn=document.getElementById("calcBtn");
  btn.addEventListener("click",function(){ saveInputs(); calculate(); });
  btn.addEventListener("touchend",function(e){e.preventDefault(); saveInputs(); calculate();},{passive:false});

  var clearBtn=document.getElementById("clearBtn");
  if(clearBtn){
    clearBtn.addEventListener("click",clearSavedInputs);
    clearBtn.addEventListener("touchend",function(e){e.preventDefault(); clearSavedInputs();},{passive:false});
  }

  var historyBtn=document.getElementById("historyBtn");
  if(historyBtn){
    historyBtn.addEventListener("click",renderHistory);
    historyBtn.addEventListener("touchend",function(e){e.preventDefault(); renderHistory();},{passive:false});
  }

  var clearHistoryBtn=document.getElementById("clearHistoryBtn");
  if(clearHistoryBtn){
    clearHistoryBtn.addEventListener("click",clearHistory);
    clearHistoryBtn.addEventListener("touchend",function(e){e.preventDefault(); clearHistory();},{passive:false});
  }

  renderHistory();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
});
</script>
</body>
</html>
