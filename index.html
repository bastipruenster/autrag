<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auftragszeit-Rechner</title>
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auftragszeit">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f7;color:#101828}
.wrap{max-width:1050px;margin:0 auto;padding:12px}
.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 10px 24px rgba(16,24,40,.12)}
.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#dbeafe;line-height:1.35}
.card{background:#fff;border:1px solid #d0d5dd;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(16,24,40,.05)}
h2{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.person{border:1px solid #d0d5dd;background:#fcfcfd;border-radius:16px;padding:12px}
.personTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.personTop h3{margin:0;font-size:17px}
.person.collapsed .personBody{display:none}
.personToggle{width:auto;min-height:34px;padding:6px 10px;border-radius:10px;font-size:13px;background:#f2f4f7;color:#344054;border:1px solid #d0d5dd;box-shadow:none}
label{display:block;font-weight:700;margin:8px 0 6px;font-size:14px}
input{width:100%;min-height:52px;border:1px solid #d0d5dd;border-radius:13px;padding:12px;font-size:18px;background:#fff}
input:focus{outline:3px solid rgba(37,99,235,.2);border-color:#2563eb}
.small{font-size:12px;color:#667085;margin-top:4px;line-height:1.35}
.block{border-top:1px solid #e4e7ec;margin-top:10px;padding-top:10px}
.blockTitle{font-size:14px;font-weight:800;color:#344054;margin-bottom:5px}
.buttons{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:12px}
button{width:100%;min-height:54px;border:0;border-radius:15px;font-size:17px;font-weight:800;color:#fff;background:#1d4ed8}
button:active{transform:translateY(1px);filter:brightness(.95)}
.save{background:#079455}.gray{background:#475467}.light{background:#f2f4f7;color:#344054;border:1px solid #d0d5dd}.red{background:#b42318}
.status{display:none;margin-bottom:12px;padding:12px;border-radius:14px;font-weight:800;background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.error{display:none;margin-bottom:12px;padding:12px;border-radius:14px;font-weight:800;background:#fef3f2;color:#b42318;border:1px solid #fecdca}
.result{display:none;margin-bottom:12px;padding:14px;border-radius:16px;font-size:20px;font-weight:800;line-height:1.45;background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.result.open{background:#fffaeb;color:#b54708;border-color:#fedf89}
.note{font-size:13px;color:#067647;font-weight:800;margin-top:5px;min-height:16px}
.out{margin-top:10px;border-radius:13px;background:#f2f4f7;padding:10px;font-size:14px;font-weight:750;line-height:1.5;color:#344054}
.hidden{display:none}
.item{border:1px solid #d0d5dd;border-radius:13px;padding:10px;margin-bottom:8px;background:#fff;line-height:1.45}
.item strong{display:block}
.doneText{color:#067647;font-weight:900}
.restText{color:#b54708;font-weight:900}
.dayGroup{margin-bottom:14px}
.dayTitle{font-size:16px;font-weight:900;color:#344054;margin:12px 0 8px;padding:8px 10px;background:#f2f4f7;border-radius:12px;border:1px solid #e4e7ec}
.historyCard{border:1px solid #d0d5dd;border-radius:15px;padding:12px;margin-bottom:9px;background:#fff;line-height:1.45;box-shadow:0 1px 5px rgba(16,24,40,.04)}
.historyMain{font-size:16px;font-weight:900;color:#101828;margin-bottom:5px}
.historySub{font-size:14px;color:#475467}
.historyDone{color:#067647;font-weight:900}
.historyRest{color:#b54708;font-weight:900}
.historyBadge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;margin-left:6px}
.segmentList{margin-top:8px;border-top:1px solid #e4e7ec;padding-top:8px}
.segmentLine{font-size:13px;color:#344054;margin-top:4px}
.segmentLine strong{display:inline;color:#101828}
@media(max-width:950px){.people{grid-template-columns:repeat(2,1fr)}.buttons{grid-template-columns:1fr 1fr}.buttons button:first-child{grid-column:1/-1}}
@media(max-width:650px){.wrap{padding:10px}.grid,.people,.buttons{grid-template-columns:1fr}input{font-size:20px;min-height:56px}.calcBtn{position:sticky;bottom:10px;z-index:10;box-shadow:0 8px 18px rgba(29,78,216,.25)}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<h1>Auftragszeit-Rechner</h1>
<p>4 Personen, Pausen, Nach-Hause-Zeit, Restzeit, Speichern und Verlauf der letzten 2 Tage.</p>
</section>

<div id="status" class="status"></div>
<div id="error" class="error"></div>
<div id="result" class="result"></div>

<section class="card">
<h2>Auftrag</h2>
<div class="grid">
<div>
<label for="auftrag">Auftragszeit gesamt in Stunden</label>
<input id="auftrag" type="text" inputmode="decimal" value="3,55" placeholder="z. B. 3,55">
<div class="small">Komma oder Punkt möglich.</div>
</div>
<div>
<label for="stueck">Stückzahl</label>
<input id="stueck" type="number" inputmode="numeric" value="20" min="1">
<div class="small">Für Zeit pro Stück.</div>
</div>
</div>
</section>

<section class="card">
<h2>Personen</h2>
<div class="people" id="people"></div>
</section>

<div class="buttons">
<button id="calcBtn" class="calcBtn" type="button">Berechnen</button>
<button id="saveBtn" class="save" type="button">Speichern</button>
<button id="clearBtn" class="light" type="button">Eingaben löschen</button>
</div>

<div class="buttons">
<button id="historyBtn" class="gray" type="button">Letzte 2 Tage anzeigen</button>
<button id="clearHistoryBtn" class="red" type="button">Verlauf löschen</button>
</div>

<section id="calcBox" class="card hidden">
<h2>Rechenweg</h2>
<div id="steps"></div>
</section>

<section id="historyBox" class="card hidden">
<h2>Letzte 2 Tage</h2>
<div id="historyList"></div>
</section>
</main>

<script>
const INPUT_KEY="az_inputs_fixed_v16";
const HISTORY_KEY="az_history_fixed_v16";

function buildPeople(){
  const box=document.getElementById("people");
  box.innerHTML="";
  for(let i=1;i<=4;i++){
    const d=document.createElement("div");
    d.className=i===1?"person":"person collapsed";
    d.id="personCard"+i;
    const toggle=i===1?"":`<button class="personToggle" type="button" data-person="${i}">Aufklappen</button>`;
    d.innerHTML=`
      <div class="personTop"><h3>Person ${i}</h3>${toggle}</div>
      <div class="personBody">
        <label>Startzeit</label>
        <input id="p${i}start" type="time">
        <label>Endzeit</label>
        <input id="p${i}end" type="time">
        <div class="small">Leer lassen = bis Fertigzeit oder Nach-Hause-Zeit.</div>
        <div id="p${i}note" class="note"></div>
        <div class="block">
          <div class="blockTitle">Feierabend</div>
          <label>Nach Hause um</label>
          <input id="p${i}home" type="time">
          <div class="small">Person zählt nur bis zu dieser Zeit.</div>
        </div>
        <div class="block">
          <div class="blockTitle">Pause</div>
          <label>Anfang Pause</label>
          <input id="p${i}pauseStart" type="time">
          <label>Pausendauer in Minuten</label>
          <input id="p${i}pauseDur" type="number" inputmode="numeric" min="0" placeholder="z. B. 30">
        </div>
        <div id="p${i}out" class="out">Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -<br>Rest bis Nach Hause: -</div>
      </div>`;
    box.appendChild(d);
  }
  document.querySelectorAll(".personToggle").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const nr=btn.getAttribute("data-person");
      const card=document.getElementById("personCard"+nr);
      const closed=card.classList.toggle("collapsed");
      btn.textContent=closed?"Aufklappen":"Zuklappen";
    });
  });
}

function n(v){return Number(String(v||"").replace(",","."));}
function tmin(v){if(!v)return null;const p=v.split(":");return Number(p[0])*60+Number(p[1]);}
function clock(m){m=Math.round(m);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function htxt(h){return h.toFixed(2).replace(".",",")+" h";}
function dtxt(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;if(h===0)return mm+" Min";if(mm===0)return h+" Std";return h+" Std "+mm+" Min";}
function showStatus(txt){const s=document.getElementById("status");s.textContent=txt;s.style.display="block";setTimeout(()=>s.style.display="none",2200);}
function showError(txt){const e=document.getElementById("error");e.textContent=txt;e.style.display="block";}
function resetOutput(){
  document.getElementById("error").style.display="none";
  const r=document.getElementById("result");r.style.display="none";r.className="result";
  document.getElementById("calcBox").classList.add("hidden");
  document.getElementById("steps").innerHTML="";
  for(let i=1;i<=4;i++){
    document.getElementById(`p${i}note`).textContent="";
    document.getElementById(`p${i}out`).innerHTML="Arbeitszeit: -<br>Pause: -<br>Anwesenheit inkl. Pause: -<br>Rest bis Nach Hause: -";
  }
}

function saveInputs(manual){
  const data={};
  document.querySelectorAll("input").forEach(inp=>{ if(inp.id)data[inp.id]=inp.value; });
  try{
    localStorage.setItem(INPUT_KEY,JSON.stringify(data));
    if(manual)showStatus("Gespeichert");
  }catch(e){
    showError("Speichern nicht möglich. Browser-Speicher ist blockiert.");
  }
}
function loadInputs(){
  try{
    const raw=localStorage.getItem(INPUT_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    Object.keys(data).forEach(id=>{const el=document.getElementById(id);if(el)el.value=data[id];});
  }catch(e){}
}
function clearInputs(){
  localStorage.removeItem(INPUT_KEY);
  document.querySelectorAll("input").forEach(inp=>{
    if(inp.id==="auftrag")inp.value="3,55";
    else if(inp.id==="stueck")inp.value="20";
    else inp.value="";
  });
  resetOutput();
  showStatus("Eingaben gelöscht");
}

function getHistory(){
  try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");}catch(e){return[];}
}
function saveHistory(entry){
  const now=Date.now(),two=2*24*60*60*1000;
  let hist=getHistory().filter(x=>x.time&&now-x.time<=two);
  entry.time=now;
  hist.unshift(entry);
  hist=hist.slice(0,50);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(hist));
}
function dayKey(ts){
  const d=new Date(ts);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayLabel(ts){
  const today=dayKey(Date.now());
  const yesterday=dayKey(Date.now()-24*60*60*1000);
  const k=dayKey(ts);
  if(k===today)return "Heute";
  if(k===yesterday)return "Gestern";
  return new Date(ts).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}
function renderHistory(){
  const box=document.getElementById("historyBox"),list=document.getElementById("historyList");
  const now=Date.now(),two=2*24*60*60*1000;
  let hist=getHistory().filter(x=>x.time&&now-x.time<=two);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(hist));
  list.innerHTML="";
  if(!hist.length){
    list.innerHTML='<div class="historyCard">Noch keine Berechnung gespeichert.</div>';
  }else{
    const groups={};
    hist.forEach(x=>{
      const k=dayKey(x.time);
      if(!groups[k])groups[k]=[];
      groups[k].push(x);
    });
    Object.keys(groups).sort().reverse().forEach(k=>{
      const group=document.createElement("div");
      group.className="dayGroup";
      const title=document.createElement("div");
      title.className="dayTitle";
      title.textContent=dayLabel(groups[k][0].time);
      group.appendChild(title);
      groups[k].sort((a,b)=>(a.startMinutes??999999)-(b.startMinutes??999999)||(a.time??0)-(b.time??0));
      groups[k].forEach(x=>{
        const div=document.createElement("div");
        div.className="historyCard";
        const range=(x.startText||"--:--")+"–"+(x.endText||"--:--");
        const total=x.totalMinutes||0,done=x.doneMinutes||0,rest=x.restMinutes||0;
        const badge=x.finished?"<span class='historyBadge'>Fertig</span>":"<span class='historyBadge'>Rest offen</span>";
        let segHtml="";
        if(x.segments&&x.segments.length){
          segHtml="<div class='segmentList'><strong>Abschnitte:</strong>";
          x.segments.forEach(s=>{
            const label=s.count===1?"1 Person":s.count+" Personen";
            segHtml+=`<div class="segmentLine"><strong>${s.from}–${s.to}</strong> · ${label} aktiv`;
            if(s.people)segHtml+=` (${s.people})`;
            segHtml+=` · ${s.durationText} = ${Math.round(s.realMinutes)} min`;
            if(s.count>1)segHtml+=` · Leistung: ${s.workText} = ${Math.round(s.workMinutes)} min`;
            segHtml+="</div>";
          });
          segHtml+="</div>";
        }
        div.innerHTML=
          `<div class="historyMain">${range} · ${dtxt(total)} = ${Math.round(total)} min ${badge}</div>`+
          `<div class="historySub"><span class="historyDone">Erledigt: ${htxt(done/60)} = ${dtxt(done)} = ${Math.round(done)} min</span><br>`+
          `<span class="historyRest">Rest morgen: ${htxt(rest/60)} = ${dtxt(rest)} = ${Math.round(rest)} min</span><br>`+
          `Gespeichert: ${new Date(x.time).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}${segHtml}</div>`;
        group.appendChild(div);
      });
      list.appendChild(group);
    });
  }
  box.classList.remove("hidden");
  box.scrollIntoView({behavior:"smooth"});
}
function clearHistory(){localStorage.removeItem(HISTORY_KEY);renderHistory();showStatus("Verlauf gelöscht");}

function isActive(p,time){
  const end=p.limit===null?Infinity:p.limit;
  if(!(p.start<=time&&time<end))return false;
  if(p.ps!==null&&p.pe!==null&&p.ps<=time&&time<p.pe)return false;
  return true;
}
function nextChange(people,time){
  const arr=[];
  people.forEach(p=>{
    if(p.start>time)arr.push(p.start);
    if(p.limit!==null&&p.limit>time)arr.push(p.limit);
    if(p.ps!==null&&p.ps>time)arr.push(p.ps);
    if(p.pe!==null&&p.pe>time)arr.push(p.pe);
  });
  return arr.length?Math.min(...arr):Infinity;
}
function historySegments(steps){
  return steps.map(s=>{
    const count=String(s.active||"").split(",").filter(x=>x.trim()).length||1;
    return {from:clock(s.from),to:clock(s.to),people:s.active,count:count,realMinutes:s.real,workMinutes:s.leistung,durationText:dtxt(s.real),workText:dtxt(s.leistung)};
  });
}

function calculate(){
  resetOutput();
  saveInputs(false);
  const auftragH=n(document.getElementById("auftrag").value);
  const stueck=Number(document.getElementById("stueck").value||0);
  if(!auftragH||auftragH<=0){showError("Bitte eine gültige Auftragszeit eingeben.");return;}
  const required=auftragH*60;
  const people=[],work={1:0,2:0,3:0,4:0},pause={1:0,2:0,3:0,4:0};

  for(let i=1;i<=4;i++){
    const sv=document.getElementById(`p${i}start`).value;
    const ev=document.getElementById(`p${i}end`).value;
    const hv=document.getElementById(`p${i}home`).value;
    const psv=document.getElementById(`p${i}pauseStart`).value;
    const pdv=document.getElementById(`p${i}pauseDur`).value;
    const pd=pdv===""?0:Number(pdv);
    if(!sv&&(ev||hv||psv||pd>0)){showError(`Bei Person ${i} fehlt die Startzeit.`);return;}
    if(pd<0){showError(`Pausendauer bei Person ${i} darf nicht negativ sein.`);return;}
    if(pd>0&&!psv){showError(`Bei Person ${i} fehlt Anfang Pause.`);return;}
    if(psv&&pd<=0){showError(`Bei Person ${i} fehlt Pausendauer.`);return;}
    if(sv){
      const start=tmin(sv);
      let end=tmin(ev),home=tmin(hv),ps=tmin(psv),pe=null;
      if(end!==null&&end<=start)end+=1440;
      if(home!==null&&home<=start)home+=1440;
      let limit=null;
      if(end!==null&&home!==null)limit=Math.min(end,home);
      else if(end!==null)limit=end;
      else if(home!==null)limit=home;
      if(limit!==null&&limit<=start){showError(`Ende/Nach Hause bei Person ${i} liegt vor Start.`);return;}
      if(ps!==null){
        if(ps<start)ps+=1440;
        pe=ps+pd;
        if(limit!==null&&ps>=limit){showError(`Pause bei Person ${i} beginnt nach Ende/Nach Hause.`);return;}
      }
      people.push({i,start,limit,home,open:ev===""&&hv==="",ps,pe});
    }
  }
  if(!people.length){showError("Bitte mindestens eine Startzeit eintragen.");return;}
  people.sort((a,b)=>a.start-b.start);
  const first=Math.min(...people.map(p=>p.start));
  let current=first,done=0,steps=[];

  for(let guard=0;guard<20000;guard++){
    const act=people.filter(p=>isActive(p,current));
    if(!act.length){
      const nx=nextChange(people,current);
      if(nx===Infinity){finish(false,current,required-done);return;}
      current=nx;continue;
    }
    const nx=nextChange(people,current);
    const rate=act.length;
    const needed=(required-done)/rate;
    if(current+needed<=nx){
      const finishTime=current+needed;
      const seg=finishTime-current;
      act.forEach(p=>work[p.i]+=seg);
      steps.push({from:current,to:finishTime,active:act.map(p=>p.i).join(", "),real:seg,leistung:seg*rate});
      done=required;
      finish(true,finishTime,0);
      return;
    }
    const seg=nx-current;
    act.forEach(p=>work[p.i]+=seg);
    done+=seg*rate;
    steps.push({from:current,to:nx,active:act.map(p=>p.i).join(", "),real:seg,leistung:seg*rate});
    current=nx;
  }
  showError("Berechnung abgebrochen.");

  function calcPause(until){
    people.forEach(p=>{
      if(p.ps!==null&&p.pe!==null){
        let a=Math.max(p.ps,p.start),b=Math.min(p.pe,until);
        if(p.limit!==null)b=Math.min(b,p.limit);
        if(b>a)pause[p.i]=b-a;
      }
    });
  }
  function fillOutputs(until){
    calcPause(until);
    for(let j=1;j<=4;j++){
      const p=people.find(x=>x.i===j);
      let restHome="-";
      if(p&&p.home!==null&&until<p.home){const rh=p.home-until;restHome=htxt(rh/60)+" = "+dtxt(rh);}
      else if(p&&p.home!==null)restHome="0 Min";
      document.getElementById(`p${j}out`).innerHTML=
        `Arbeitszeit: ${htxt(work[j]/60)} = ${dtxt(work[j])}<br>`+
        `Pause: ${Math.round(pause[j])} min = ${dtxt(pause[j])}<br>`+
        `Anwesenheit inkl. Pause: ${htxt((work[j]+pause[j])/60)} = ${dtxt(work[j]+pause[j])}<br>`+
        `Rest bis Nach Hause: ${restHome}`;
    }
  }
  function finish(finished,time,rest){
    rest=Math.max(0,rest);
    fillOutputs(time);
    const total=time-first;
    const r=document.getElementById("result");
    if(finished){
      r.className="result";
      let homeLines=[];
      people.forEach(p=>{if(p.home!==null&&time<p.home){const rh=p.home-time;homeLines.push(`Person ${p.i}: ${dtxt(rh)} (${htxt(rh/60)})`);}});
      r.innerHTML=`Fertig um ${clock(time)} Uhr<br><span style="font-size:16px">Gesamtdauer: ${dtxt(total)} (${htxt(total/60)})</span><br><span style="font-size:16px" class="restText">Rest für nächsten Tag: 0 Min</span>${homeLines.length?'<br><span style="font-size:16px">Zeit bis Nach Hause: '+homeLines.join(" | ")+"</span>":""}`;
      saveHistory({finished:true,startText:clock(first),endText:clock(time),startMinutes:first,endMinutes:time,totalMinutes:total,doneMinutes:done,restMinutes:0,segments:historySegments(steps)});
    }else{
      r.className="result open";
      r.innerHTML=`Heute nicht fertig<br><span style="font-size:16px">Berechnet bis: ${clock(time)} Uhr</span><br><span style="font-size:16px" class="doneText">Erledigt: ${htxt(done/60)} = ${dtxt(done)}</span><br><span style="font-size:16px" class="restText">Rest für nächsten Tag: ${htxt(rest/60)} = ${dtxt(rest)}</span>`;
      saveHistory({finished:false,startText:clock(first),endText:clock(time),startMinutes:first,endMinutes:time,totalMinutes:total,doneMinutes:done,restMinutes:rest,segments:historySegments(steps)});
    }
    r.style.display="block";
    people.forEach(p=>{
      const note=document.getElementById(`p${p.i}note`);
      if(finished&&p.open)note.textContent=`Berechnetes Ende: ${clock(time)} Uhr`;
      else if(p.home!==null)note.textContent=`Berechnet bis Nach Hause: ${clock(p.home)} Uhr`;
      else if(p.limit!==null)note.textContent=`Berechnet bis Ende: ${clock(p.limit)} Uhr`;
    });
    showSteps(total,rest);
  }
  function showSteps(total,rest){
    const box=document.getElementById("steps");
    box.innerHTML="";
    const head=document.createElement("div");
    head.className="item";
    const per=stueck>0?`<br>Zeit pro Stück: <strong>${htxt(auftragH/stueck)} = ${dtxt(required/stueck)}</strong>`:"";
    head.innerHTML=`Auftragszeit gesamt: <strong>${htxt(auftragH)} = ${dtxt(required)}</strong>${per}<br><span class="doneText">Erledigt: <strong>${htxt(done/60)} = ${dtxt(done)}</strong></span><br><span class="restText">Rest für nächsten Tag: <strong>${htxt(rest/60)} = ${dtxt(rest)}</strong></span><br>Berechnete Dauer: <strong>${dtxt(total)} = ${htxt(total/60)}</strong>`;
    box.appendChild(head);
    steps.forEach(s=>{
      const d=document.createElement("div");
      d.className="item";
      d.innerHTML=`<strong>${clock(s.from)} bis ${clock(s.to)}</strong>Person(en) aktiv: ${s.active}<br>Echte Zeit: ${dtxt(s.real)} (${Math.round(s.real)} min)<br>Arbeitsleistung: ${dtxt(s.leistung)} = ${htxt(s.leistung/60)}`;
      box.appendChild(d);
    });
    document.getElementById("calcBox").classList.remove("hidden");
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  buildPeople();
  loadInputs();
  document.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input",()=>saveInputs(false));
    inp.addEventListener("change",()=>saveInputs(false));
  });
  document.getElementById("calcBtn").addEventListener("click",calculate);
  document.getElementById("saveBtn").addEventListener("click",()=>saveInputs(true));
  document.getElementById("clearBtn").addEventListener("click",clearInputs);
  document.getElementById("historyBtn").addEventListener("click",renderHistory);
  document.getElementById("clearHistoryBtn").addEventListener("click",clearHistory);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
});
</script>
</body>
</html>
